# Transaction Service runtime configuration (DD-05 / L2-FR-10).
# Every value the engine's wiring used to hardcode lives here instead -
# change behavior by editing this file, not TransactionServiceApplication.java.

# US-01 / L2-FR-01: classpath resource the batch is loaded from.
txservice.input.resource-path=sample-transactions.json

# US-06 / DD-04: max retry attempts before a transiently-failing transaction is marked FAILED.
txservice.retry.max-attempts=3

# US-12 / L2-FR-13 / DD-12: name of the single background-consumer thread.
txservice.worker.thread-name=background-worker
